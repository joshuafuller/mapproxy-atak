include /etc/nginx/snippets/real-ip.conf;

log_format mapproxy_json escape=json
    '{"time":"$time_iso8601","client":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';

server {
    listen 8080;
    server_name _;
    root /srv/runtime/site;
    index index.html;
    access_log /dev/stdout mapproxy_json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ATAK uses the response Content-Type when deciding the downloaded file's
    # extension and importer. This must not be text/plain.
    location ~ ^/sources/(?<source_file>[A-Za-z0-9._-]+\.xml)$ {
      types { }
      default_type application/xml;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      alias /srv/runtime/$source_file;
    }

    location /mapproxy/ {
        proxy_pass http://mapproxy:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
