<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ATAK MapProxy</title>
  <desc id="desc">A green tactical-style banner for a responsible local map cache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100b"/>
      <stop offset="0.55" stop-color="#102319"/>
      <stop offset="1" stop-color="#173c24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#69dd8b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#69dd8b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#69dd8b" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1005" cy="180" r="118" fill="none" stroke="#69dd8b" stroke-opacity=".16"/>
  <circle cx="1005" cy="180" r="82" fill="none" stroke="#69dd8b" stroke-opacity=".22"/>
  <circle cx="1005" cy="180" r="46" fill="none" stroke="#69dd8b" stroke-opacity=".32"/>
  <path d="M865 180h280M1005 40v280" stroke="#69dd8b" stroke-opacity=".2"/>
  <circle cx="1005" cy="180" r="10" fill="#69dd8b"/>
  <circle cx="1005" cy="180" r="22" fill="#69dd8b" opacity=".18" filter="url(#soft)"/>
  <path d="M1005 92c-38 0-69 30-69 68 0 51 69 112 69 112s69-61 69-112c0-38-31-68-69-68zm0 96a28 28 0 1 1 0-56 28 28 0 0 1 0 56z" fill="none" stroke="#69dd8b" stroke-width="4" opacity=".86"/>
  <text x="72" y="105" fill="#69dd8b" font-family="DejaVu Sans Mono" font-size="16" font-weight="700" letter-spacing="3">LAN MAP INFRASTRUCTURE</text>
  <text x="68" y="190" fill="#edf7ef" font-family="DejaVu Sans" font-size="68" font-weight="700">ATAK MapProxy</text>
  <text x="72" y="242" fill="#b9cfbf" font-family="DejaVu Sans" font-size="27">One uplink fetch. Many LAN clients.</text>
  <rect x="72" y="276" width="196" height="38" rx="19" fill="#69dd8b" fill-opacity=".14" stroke="#69dd8b" stroke-opacity=".55"/>
  <circle cx="94" cy="295" r="5" fill="#69dd8b"/>
  <text x="110" y="302" fill="#c9f4d4" font-family="DejaVu Sans Mono" font-size="16" font-weight="700">DOCKER READY</text>
