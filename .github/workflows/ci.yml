---
name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Generate test deployment
        run: |
          if docker compose run --rm configure \
            127.0.0.1 "" 18080; then
            echo "Missing contact URL was accepted." >&2
            exit 1
          fi
          docker compose run --rm configure \
            127.0.0.1 https://example.com/contact 18080

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 90

      - name: Validate configuration and live endpoints
        run: ./scripts/validate.sh --live

      - name: Check Windows helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/windows-forwarder.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Start and validate optional monitoring
        run: |
          docker compose --profile monitoring up -d --wait
          ./scripts/validate-monitoring.sh --wait
          docker compose --profile monitoring stop grafana alloy loki

      - name: Confirm generated files remain untracked
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --no-color

      - name: Stop services
        if: always()
        run: docker compose --profile monitoring down --volumes
